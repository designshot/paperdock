name: Test PaperDock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Check browser code
        run: |
          node --check paperdock/static/app.js
          node --check paperdock/static/theme.js
      - name: Check installer entrypoints
        run: |
          bash -n install.sh
          bash -n bootstrap.sh
          bash install.sh --dry-run
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Check source and wheel contents
        run: python scripts/check_packages.py dist
